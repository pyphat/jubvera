<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Class Timer</title>
<style>
  @font-face {
    font-family: "DB Heavent";
    /* single static weight declared across the range so the browser never
       fakes a bold that the font does not have */
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
    src: url("fonts/DB Heavent.ttf") format("truetype");
  }

  :root {
    --bg: #0a0a0a;
    --digit: #f2f2f2;
    --blue: #7ea6d4;
    --blue-dim: #63819f;
    --green: #7ac74f;
    --odo-scale: 1;
    /* DB Heavent: digit advance 0.38em, digit ink 0.50em, so the em is
       ~1.44x larger than the old stack needed for the same visual size */
    --fs: min(calc(clamp(70px, 17vw, 272px) * var(--odo-scale)), 26vw, 62vh);
    --dh: calc(var(--fs) * 0.84);
    --dw: calc(var(--fs) * 0.42);
    --gap-digit: calc(var(--fs) * 0.04);
    --gap-group: calc(var(--fs) * 0.16);
    /* optical centring nudge for the reel strip, in em */
    --digit-lift: 0.01;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background:
      radial-gradient(120% 90% at 50% 45%, #121212 0%, var(--bg) 62%),
      var(--bg);
    color: var(--digit);
    font-family: "DB Heavent", "Segoe UI Variable Display", "Segoe UI",
                 "Noto Sans Thai", "Leelawadee UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  button, input { font-family: inherit; }

  .stage {
    min-height: 100%;
    display: grid;
    grid-template-rows: 1fr auto 1fr;
    justify-content: center;
    justify-items: center;
    align-items: center;
    padding: 4vh 4vw;
    position: relative;
  }

  /* the odometer owns the middle row, so it stays dead centre no matter
     how tall the subject line or the progress bar get */
  .focus { display: contents; }

  /* ---------- focus block ---------- */
  .subject {
    grid-row: 1;
    align-self: end;
    justify-self: end;
    text-align: right;
    color: var(--digit);
    font-size: clamp(30px, 3.4vw, 48px);
    font-weight: 400;
    margin-bottom: calc(var(--fs) * 0.01);
  }

  /* ---------- odometer ---------- */
  .odometer {
    grid-row: 2;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: var(--gap-group);
  }

  .group {
    display: flex;
    gap: var(--gap-digit);
  }

  .digit {
    position: relative;
    width: var(--dw);
    height: var(--dh);
    overflow: hidden;
  }

  .reel {
    position: absolute;
    top: calc(var(--fs) * var(--digit-lift));
    left: 0;
    width: 100%;
    height: var(--dh);
    --pos: 0;
    transform: translateY(calc(var(--dh) * var(--pos) * -1));
    transition: transform 380ms cubic-bezier(0.22, 1.3, 0.34, 1);
  }

  .reel span {
    display: block;
    height: var(--dh);
    line-height: var(--dh);
    text-align: center;
    font-size: var(--fs);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    color: var(--digit);
  }

  /* ---------- progress ---------- */
  .progress {
    grid-row: 3;
    align-self: start;
    justify-self: stretch;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 28px;
    margin-top: calc(var(--fs) * 0.03);
  }

  .progress.hidden { visibility: hidden; }

  .left {
    flex: 0 0 auto;
    white-space: nowrap;
    font-size: clamp(30px, 3.3vw, 46px);
    font-weight: 600;
    color: #e9e9e9;
  }

  .track {
    flex: 1 1 150px;
    min-width: 150px;
    height: 12px;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.14);
    overflow: hidden;
  }

  .track > i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 6px;
    background: var(--green);
    box-shadow: 0 0 22px rgba(122, 199, 79, 0.65);
  }

  /* ---------- next subject ---------- */
  .next {
    position: absolute;
    right: 4vw;
    bottom: 5vh;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    text-align: right;
  }

  .next.hidden { display: none; }

  .next-label {
    color: var(--blue-dim);
    font-size: clamp(14px, 1.35vw, 19px);
  }

  .next-rule {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 10px 0 10px;
  }

  .next-rule i {
    display: block;
    width: clamp(80px, 12vw, 160px);
    height: 1px;
    background: rgba(255, 255, 255, 0.45);
  }

  .next-rule b {
    display: block;
    width: 7px;
    height: 7px;
    border-top: 1px solid rgba(255, 255, 255, 0.75);
    border-right: 1px solid rgba(255, 255, 255, 0.75);
    transform: rotate(45deg);
    margin-left: -4px;
  }

  .next-name {
    color: #dfe7f2;
    font-size: clamp(17px, 1.65vw, 24px);
  }

  /* ---------- settings button ---------- */
  .settings {
    position: absolute;
    left: 4vw;
    bottom: 5vh;
    background: none;
    border: none;
    padding: 0 0 3px;
    color: var(--blue-dim);
    font-size: clamp(14px, 1.35vw, 19px);
    cursor: pointer;
    border-bottom: 1px solid transparent;
  }

  .settings:hover { color: var(--blue); border-bottom-color: var(--blue); }

  /* ---------- focus mode (F) ---------- */
  body.focused .subject,
  body.focused .progress,
  body.focused .settings { display: none; }

  /* ---------- settings panel ---------- */
  .panel {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    display: grid;
    place-items: center;
    padding: 4vh 3vw;
    z-index: 10;
  }

  .panel[hidden] { display: none; }

  .sheet {
    width: min(860px, 100%);
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    background: #101010;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 16px;
    padding: 24px;
  }

  .sheet h2 {
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 500;
  }

  .sheet .hint {
    margin: 0 0 18px;
    color: var(--blue-dim);
    font-size: 15px;
  }

  .sheet .hint.keys { margin: 14px 0 18px; }

  .sheet kbd {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: #1a1a1a;
    color: #cfd6de;
    font-family: inherit;
    font-size: 14px;
  }

  /* ---------- odometer size ---------- */
  .sizer {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    margin-bottom: 16px;
    background: #131313;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
  }

  .sizer label {
    font-size: 17px;
    white-space: nowrap;
  }

  .sizer input[type="range"] {
    flex: 1;
    min-width: 0;
    accent-color: var(--blue);
    cursor: pointer;
  }

  .sizer output {
    width: 5em;
    text-align: right;
    color: var(--blue-dim);
    font-size: 18px;
    font-variant-numeric: tabular-nums;
  }

  .rows {
    overflow-y: auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 4px;
  }

  .row {
    display: grid;
    grid-template-columns: 132px 12px 132px 1fr 150px 34px;
    align-items: center;
    gap: 10px;
  }

  .row .dash { color: var(--blue-dim); text-align: center; }

  .row input {
    width: 100%;
    background: #161616;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 9px;
    color: var(--digit);
    padding: 10px 12px;
    font-size: 18px;
    outline: none;
  }

  .row input:focus { border-color: var(--blue); }
  .row input::placeholder { color: #55606e; }

  .row .del {
    background: none;
    border: none;
    color: #6a7482;
    font-size: 19px;
    cursor: pointer;
    line-height: 1;
  }

  .row .del:hover { color: #ff6b6b; }

  .actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
  }

  .actions .spacer { flex: 1; }

  .actions .msg {
    font-size: 15px;
    color: var(--blue-dim);
  }

  .actions .msg.bad { color: #ff8f8f; }

  .actions button {
    background: #191919;
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 9px;
    color: #d8d8d8;
    padding: 11px 18px;
    font-size: 17px;
    cursor: pointer;
  }

  .actions button:hover { border-color: var(--blue); color: #fff; }

  .actions button.primary {
    background: var(--blue);
    border-color: var(--blue);
    color: #06121f;
    font-weight: 600;
  }

  .actions button.primary:hover { background: #93b7e0; }
</style>
</head>
<body>
  <main class="stage">
    <section class="focus">
      <div class="subject" id="subject">—</div>
      <div class="odometer" id="odo">
        <div class="group" id="gH"></div>
        <div class="group" id="gM"></div>
        <div class="group" id="gS"></div>
      </div>
      <div class="progress" id="progress">
        <div class="left" id="left">—</div>
        <div class="track" id="track"><i></i></div>
      </div>
    </section>

    <aside class="next hidden" id="nextBlock">
      <div class="next-label">วิชาถัดไป</div>
      <div class="next-rule"><i></i><b></b></div>
      <div class="next-name" id="nextName">—</div>
    </aside>

    <button class="settings" id="openSettings">ตั้งค่า</button>
  </main>

  <div class="panel" id="panel" hidden>
    <div class="sheet">
      <h2>ตั้งค่า</h2>
      <p class="hint">แก้ไขเวลา ชื่อวิชา และรหัสวิชาได้ตามต้องการ — บันทึกไว้ในเครื่องนี้</p>
      <div class="sizer">
        <label for="scale">ขนาดตัวเลขเวลา</label>
        <input id="scale" type="range" min="50" max="200" step="5" />
        <output id="scaleOut">100%</output>
      </div>
      <p class="hint keys">กด <kbd>F</kbd> เพื่อสลับโหมดโฟกัส — เหลือเฉพาะตัวเลขเวลากับวิชาถัดไป กด <kbd>Esc</kbd> เพื่อออก</p>
      <div class="rows" id="rows"></div>
      <div class="actions">
        <button id="addRow">+ เพิ่มคาบเรียน</button>
        <button id="reset">ค่าเริ่มต้น</button>
        <span class="spacer"></span>
        <span class="msg" id="msg"></span>
        <button id="cancel">ยกเลิก</button>
        <button class="primary" id="save">บันทึก</button>
      </div>
    </div>
  </div>

<script>
const DEFAULTS = [
  { start: "08:30", end: "09:30", name: "ภาษาและวัฒนธรรมไทย 1", code: "ท33101" },
  { start: "09:40", end: "10:40", name: "เคมี 4",                code: "ว30224" },
  { start: "11:10", end: "12:10", name: "คณิตศาสตร์พื้นฐาน 5",  code: "ค33101" },
  { start: "13:30", end: "14:30", name: "ประวัติศาสตร์ 2",         code: "ส33102" },
  { start: "15:00", end: "16:00", name: "ภาษาอังกฤษพื้นฐาน 5",    code: "อ33101" }
];

const KEY = "class-timer-schedule-v1";
const KEY_PREFS = "class-timer-prefs-v1";
const SCALE_MIN = 50;
const SCALE_MAX = 200;

const toSec = t => { const [h, m] = t.split(":").map(Number); return h * 3600 + m * 60; };
const norm = t => {
  const [h, m] = String(t).split(":");
  return String(h).padStart(2, "0") + ":" + String(m).padStart(2, "0");
};
const isTime = t => /^([01]?\d|2[0-3]):[0-5]\d$/.test(String(t).trim());

const clone = a => a.map(o => ({ ...o }));

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return clone(DEFAULTS);
    const data = JSON.parse(raw);
    if (!Array.isArray(data) || !data.length) return clone(DEFAULTS);
    return data.filter(c => c && isTime(c.start) && isTime(c.end)).map(c => ({
      start: norm(c.start), end: norm(c.end),
      name: String(c.name || ""), code: String(c.code || "")
    }));
  } catch {
    return clone(DEFAULTS);
  }
}

function save(data) {
  try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
}

/* ---------------- odometer size ---------------- */
const clampScale = v =>
  Math.min(SCALE_MAX, Math.max(SCALE_MIN, Math.round(Number(v) || 100)));

function loadScale() {
  try {
    const raw = localStorage.getItem(KEY_PREFS);
    if (!raw) return 100;
    return clampScale(JSON.parse(raw)?.scale);
  } catch {
    return 100;
  }
}

function saveScale(pct) {
  try { localStorage.setItem(KEY_PREFS, JSON.stringify({ scale: pct })); } catch {}
}

let scale = loadScale();

const root = document.documentElement;

function applyScale(pct) {
  root.style.setProperty("--odo-scale", (clampScale(pct) / 100).toFixed(2));
}

applyScale(scale);

let SCHEDULE = load();
let draft = clone(SCHEDULE);

const reindex = () => SCHEDULE.forEach(c => { c.s = toSec(c.start); c.e = toSec(c.end); });
reindex();

/* ---------------- dom ---------------- */
const el = {
  subject: document.getElementById("subject"),
  left: document.getElementById("left"),
  progress: document.getElementById("progress"),
  fill: document.querySelector("#track > i"),
  nextBlock: document.getElementById("nextBlock"),
  nextName: document.getElementById("nextName"),
  panel: document.getElementById("panel"),
  rows: document.getElementById("rows"),
  msg: document.getElementById("msg"),
  scale: document.getElementById("scale"),
  scaleOut: document.getElementById("scaleOut")
};

/* ---------------- digit reels ---------------- */
function makeGroup(id, count) {
  const host = document.getElementById(id);
  const digits = [];
  for (let i = 0; i < count; i++) {
    const digit = document.createElement("div");
    digit.className = "digit";
    const reel = document.createElement("div");
    reel.className = "reel";
    for (let n = 0; n < 12; n++) {
      const s = document.createElement("span");
      s.textContent = n % 10;
      reel.appendChild(s);
    }
    digit.appendChild(reel);
    host.appendChild(digit);
    digits.push(digit);
  }
  return digits;
}

const digits = { H: makeGroup("gH", 2), M: makeGroup("gM", 2), S: makeGroup("gS", 2) };
const lastPos = {};

function setDigit(key, index, value) {
  const id = key + index;
  if (lastPos[id] === value) return;
  lastPos[id] = value;
  digits[key][index].firstChild.style.setProperty("--pos", value);
}

/* ---------------- schedule lookup ---------------- */
const activeIndex = now => SCHEDULE.findIndex(c => now >= c.s && now < c.e);
const upcomingIndex = now => SCHEDULE.findIndex(c => now < c.s);

function fmtLeft(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return (h ? h + "h " : "") + m + "m " + s + "s left";
}

function fmtSubject(c) { return c.name + (c.code ? " (" + c.code + ")" : ""); }

let lastState = "";
let lastFill = -1;
let lastLeft = "";

function render() {
  const now = new Date();
  const nowSec = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds() + now.getMilliseconds() / 1000;

  const i = activeIndex(nowSec);
  const inClass = i !== -1;
  const shown = inClass ? i : upcomingIndex(nowSec);
  const cur = shown === -1 ? null : SCHEDULE[shown];
  const nxtIdx = shown === -1 ? -1 : upcomingIndex(cur.e + 1);

  const state = shown + ":" + inClass;
  if (state !== lastState) {
    lastState = state;
    el.subject.textContent = cur ? fmtSubject(cur) : "วันนี้จบแล้ว";
    el.progress.classList.toggle("hidden", !inClass);
    if (nxtIdx === -1) {
      el.nextBlock.classList.add("hidden");
    } else {
      el.nextBlock.classList.remove("hidden");
      el.nextName.textContent = fmtSubject(SCHEDULE[nxtIdx]);
    }
  }

  /* ---- odometer always shows the current time ---- */
  const h = now.getHours();
  const m = now.getMinutes();
  const s = now.getSeconds();

  setDigit("H", 0, Math.floor(h / 10));
  setDigit("H", 1, h % 10);
  setDigit("M", 0, Math.floor(m / 10));
  setDigit("M", 1, m % 10);
  setDigit("S", 0, Math.floor(s / 10));
  setDigit("S", 1, s % 10);

  /* ---- time left + progress, only while a class runs ---- */
  if (inClass) {
    const remain = Math.max(0, Math.ceil(cur.e - nowSec));
    const leftTxt = fmtLeft(remain);
    if (leftTxt !== lastLeft) {
      el.left.textContent = leftTxt;
      lastLeft = leftTxt;
    }
    const pct = Math.min(1, Math.max(0, (nowSec - cur.s) / (cur.e - cur.s)));
    if (Math.abs(pct - lastFill) > 0.0004) {
      el.fill.style.width = (pct * 100).toFixed(2) + "%";
      lastFill = pct;
    }
  } else {
    lastFill = -1;
  }
}

function loop() {
  render();
  requestAnimationFrame(loop);
}

/* ---------------- settings panel ---------------- */
function addRow(c) {
  const row = document.createElement("div");
  row.className = "row";

  const start = document.createElement("input");
  start.type = "time";
  start.value = c.start;

  const dash = document.createElement("div");
  dash.className = "dash";
  dash.textContent = "–";

  const end = document.createElement("input");
  end.type = "time";
  end.value = c.end;

  const name = document.createElement("input");
  name.type = "text";
  name.placeholder = "ชื่อวิชา";
  name.value = c.name;

  const code = document.createElement("input");
  code.type = "text";
  code.placeholder = "รหัสวิชา";
  code.value = c.code;

  const del = document.createElement("button");
  del.className = "del";
  del.textContent = "✕";
  del.title = "ลบคาบเรียนนี้";
  del.addEventListener("click", () => row.remove());

  row.append(start, dash, end, name, code, del);
  el.rows.appendChild(row);
  return { start, end, name, code };
}

function openPanel() {
  draft = clone(SCHEDULE);
  el.rows.replaceChildren();
  draft.forEach(addRow);
  el.scale.value = String(scale);
  el.scaleOut.textContent = scale + "%";
  el.msg.textContent = "";
  el.msg.classList.remove("bad");
  el.panel.hidden = false;
  const first = el.rows.querySelector("input");
  if (first) first.focus();
}

function closePanel() {
  el.panel.hidden = true;
  applyScale(scale);
}

/* live preview while dragging, discarded unless saved */
el.scale.addEventListener("input", () => {
  const pct = clampScale(el.scale.value);
  el.scaleOut.textContent = pct + "%";
  applyScale(pct);
});

document.getElementById("openSettings").addEventListener("click", openPanel);
document.getElementById("cancel").addEventListener("click", closePanel);

document.getElementById("addRow").addEventListener("click", () => {
  addRow({ start: "08:00", end: "09:00", name: "", code: "" });
  el.rows.lastElementChild.querySelector("input[type=text]").focus();
});

document.getElementById("reset").addEventListener("click", () => {
  el.rows.replaceChildren();
  clone(DEFAULTS).forEach(addRow);
  el.scale.value = "100";
  el.scaleOut.textContent = "100%";
  applyScale(100);
  el.msg.textContent = "กลับสู่ตารางเริ่มต้นแล้ว (ยังไม่บันทึก)";
  el.msg.classList.remove("bad");
});

document.getElementById("save").addEventListener("click", () => {
  const clean = [];
  const problems = [];

  el.rows.querySelectorAll(".row").forEach((row, n) => {
    const [start, end, name, code] = row.querySelectorAll("input");
    const s = start.value.trim();
    const e = end.value.trim();
    const nm = name.value.trim();
    if (!isTime(s) || !isTime(e) || !nm) {
      problems.push(n + 1);
      return;
    }
    clean.push({ start: norm(s), end: norm(e), name: nm, code: code.value.trim() });
  });

  if (!clean.length) {
    el.msg.textContent = "ต้องมีคาบเรียนที่ถูกต้องอย่างน้อย 1 คาบ";
    el.msg.classList.add("bad");
    return;
  }

  clean.sort((a, b) => toSec(a.start) - toSec(b.start));

  scale = clampScale(el.scale.value);
  saveScale(scale);
  applyScale(scale);

  SCHEDULE = clean;
  reindex();
  save(SCHEDULE);
  lastState = "";
  lastFill = -1;
  lastLeft = "";
  render();
  closePanel();

  if (problems.length) {
    console.warn("ข้ามแถวที่ไม่สมบูรณ์:", problems.join(", "));
  }
});

el.panel.addEventListener("click", e => { if (e.target === el.panel) closePanel(); });

/* ---------------- focus mode ---------------- */
const isFocused = () => document.body.classList.contains("focused");

function setFocused(on) {
  document.body.classList.toggle("focused", on);
}

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;

  const t = e.target;
  if (t instanceof HTMLElement &&
      (t.isContentEditable || /^(input|textarea|select)$/i.test(t.tagName))) return;

  if (e.key === "Escape") {
    if (!el.panel.hidden) closePanel();
    else setFocused(false);
    return;
  }

  if (!el.panel.hidden) return;

  if (e.key === "f" || e.key === "F") {
    setFocused(!isFocused());
    e.preventDefault();
  }
});

requestAnimationFrame(loop);
</script>
</body>
</html>
